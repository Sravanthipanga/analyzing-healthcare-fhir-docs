<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AskFHIR — Observability</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 960px; padding: 0 1rem; color: #1a1a2e; }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
  th, td { border: 1px solid #ddd; padding: .35rem .6rem; text-align: right; font-size: .9rem; }
  th:first-child, td:first-child { text-align: left; }
  .cards { display: flex; gap: 1rem; flex-wrap: wrap; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; min-width: 180px; }
  .card .big { font-size: 1.5rem; font-weight: 700; }
  .card .label { color: #666; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .trace { border: 1px solid #eee; border-radius: 6px; padding: .6rem .8rem; margin: .5rem 0; font-size: .85rem; }
  .bar { height: 8px; background: #4f6bed; border-radius: 4px; margin: 2px 0 6px; }
  .muted { color: #777; }
</style>
</head>
<body>
<h1>AskFHIR — Observability</h1>
<p class="muted">Live window: latency percentiles per stage, cost per request, quality signals, recent traces. Refreshes every 5s.</p>

<div class="cards" id="cards"></div>

<h2>Stage latency (ms)</h2>
<table id="latency"><thead><tr><th>Stage</th><th>Count</th><th>Mean</th><th>p50</th><th>p95</th><th>p99</th><th>Max</th></tr></thead><tbody></tbody></table>

<h2>Recent traces</h2>
<div id="traces"></div>

<script>
async function refresh() {
  const snap = await (await fetch('/observability')).json();
  const c = snap.cost, q = snap.quality;
  const cards = [
    ['Requests', q.requests ?? 0],
    ['p95 latency (ask)', (snap.latency.ask?.p95_ms ?? 0) + ' ms'],
    ['Cost / request', '$' + (c.mean_usd ?? 0).toFixed(6)],
    ['Cost / 1k requests', '$' + (c.per_1k_requests_usd ?? 0).toFixed(2)],
    ['Abstention rate', ((q.abstention_rate ?? 0) * 100).toFixed(1) + '%'],
    ['Citations / answer', q.citations_per_answer ?? 0],
  ];
  document.getElementById('cards').innerHTML = cards.map(([l, v]) =>
    `<div class="card"><div class="label">${l}</div><div class="big">${v}</div></div>`).join('');
  document.querySelector('#latency tbody').innerHTML = Object.entries(snap.latency).map(([stage, s]) =>
    `<tr><td>${stage}</td><td>${s.count}</td><td>${s.mean_ms}</td><td>${s.p50_ms}</td><td>${s.p95_ms}</td><td>${s.p99_ms}</td><td>${s.max_ms}</td></tr>`).join('');
  const traces = await (await fetch('/observability/traces?limit=8')).json();
  document.getElementById('traces').innerHTML = traces.map(t => {
    const total = t.duration_ms || 1;
    const bars = t.spans.filter(s => s.name !== 'ask').map(s =>
      `<div>${s.name} — ${s.duration_ms} ms</div><div class="bar" style="width:${Math.max(2, s.duration_ms / total * 100)}%"></div>`).join('');
    return `<div class="trace"><strong>${t.trace_id.slice(0, 8)}</strong> · ${t.duration_ms} ms · abstained: ${t.attributes.abstained} · citations: ${t.attributes.citations}${bars}</div>`;
  }).join('') || '<p class="muted">No traces yet — ask a question first.</p>';
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
