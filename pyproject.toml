[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askfhir"
version = "0.1.0"
description = "AskFHIR — production-pattern RAG over FHIR/HL7 docs with hybrid retrieval, reranking, and enforced citations"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "numpy",
    "rank-bm25",
]

[project.optional-dependencies]
models = ["fastembed"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
